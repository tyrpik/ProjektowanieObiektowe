<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <title>Rejestracja</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 480px; margin: 60px auto; background: #f5f5f5; }
    h2 { text-align: center; }
    .form-box { background: white; padding: 32px; border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,.1); }
    label { display: block; margin-top: 14px; font-weight: bold; font-size: 14px; }
    input { width: 100%; padding: 9px 11px; margin-top: 4px; border: 1.5px solid #ccc; border-radius: 6px;
            box-sizing: border-box; font-size: 14px; }
    input.error { border-color: #e53e3e; }
    .error-msg { color: #e53e3e; font-size: 12px; margin-top: 3px; display: none; }
    .error-msg.visible { display: block; }
    button { margin-top: 22px; width: 100%; padding: 11px; background: #8346e5;
             color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; }
    button:hover { background: #9863ec; }
    #success-msg { display: none; color: #276749; background: #f0f3f1; padding: 12px;
                   border-radius: 6px; margin-top: 16px; text-align: center; font-weight: bold; }
  </style>
</head>
<body>
<div class="form-box">
  <h2>Rejestracja</h2>

  <label for="username">Nazwa użytkownika *</label>
  <input type="text" id="username" placeholder="twoja_nazwa_użytkownika" />
  <div class="error-msg" id="username-error">Pole wymagane.</div>

  <label for="email">Adres e-mail *</label>
  <input type="text" id="email" placeholder="np. imie@example.com" />
  <div class="error-msg" id="email-error">Wprowadź poprawny adres e-mail.</div>

  <label for="password">Hasło *</label>
  <input type="password" id="password" placeholder="min. 6 znaków" />
  <div class="error-msg" id="password-error">Hasło musi mieć co najmniej 6 znaków.</div>

  <label for="confirm">Powtórz hasło *</label>
  <input type="password" id="confirm" placeholder="powtórz hasło" />
  <div class="error-msg" id="confirm-error">Hasła nie są zgodne.</div>

  <button id="submit-btn" onclick="validateForm()">Zarejestruj się</button>
  <div id="success-msg">Rejestracja zakończona sukcesem!</div>
</div>

<script>
  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  function showError(fieldId, msgId, show) {
    const field = document.getElementById(fieldId);
    const msg   = document.getElementById(msgId);
    if (show) { field.classList.add('error'); msg.classList.add('visible'); }
    else { field.classList.remove('error'); msg.classList.remove('visible'); }
  }

  function validateForm() {
    const username = document.getElementById('username').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;

    let valid = true;

    if (!username) { showError('username','username-error',true);  valid=false; }
    else { showError('username','username-error',false); }

    if (!email || !EMAIL_RE.test(email)) { showError('email','email-error',true); valid=false; }
    else { showError('email','email-error',false); }

    if (!password || password.length < 6) { showError('password','password-error',true); valid=false; }
    else { showError('password','password-error',false); }

    if (!confirm) { showError('confirm','confirm-error',true); valid = false; }
    else if (password !== confirm) { showError('confirm','confirm-error',true); valid = false; }
    else { showError('confirm','confirm-error',false); }

    document.getElementById('success-msg').style.display = valid ? 'block' : 'none';
  }
</script>
</body>
</html>
