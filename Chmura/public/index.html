<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lista Zakupów</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 16px;
    }

    .card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 480px;
      padding: 32px;
    }

    h1 {
      font-size: 1.8rem;
      color: #1a202c;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .add-form {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .add-form input {
      flex: 1;
      padding: 10px 14px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .add-form input:focus { border-color: #4f96f0; }

    .add-form button {
      padding: 10px 18px;
      background: #4f96f0;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1.2rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .add-form button:hover { background: #3578d4; }

    ul { list-style: none; }

    li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #f0f4f8;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; } }

    li:last-child { border-bottom: none; }

    .check-btn {
      width: 26px; height: 26px;
      border-radius: 50%;
      border: 2px solid #cbd5e0;
      background: white;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
      font-size: 0.8rem;
    }

    .check-btn.done { background: #48bb78; border-color: #48bb78; color: white; }

    .item-name {
      flex: 1;
      font-size: 1rem;
      color: #2d3748;
      transition: all 0.2s;
    }

    .item-name.done {
      text-decoration: line-through;
      color: #a0aec0;
    }

    .del-btn {
      background: none;
      border: none;
      color: #fc8181;
      cursor: pointer;
      font-size: 1.1rem;
      padding: 4px 8px;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .del-btn:hover { background: #fff5f5; }

    .empty {
      text-align: center;
      color: #a0aec0;
      padding: 24px 0;
      font-size: 0.95rem;
    }

    .count {
      font-size: 0.85rem;
      color: #718096;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Lista Zakupów</h1>

    <div class="add-form">
      <input type="text" id="newItem" placeholder="Dodaj produkt..." />
      <button onclick="addItem()">+</button>
    </div>

    <p class="count" id="count"></p>
    <ul id="list"></ul>
    <p class="empty" id="empty" style="display:none">Lista jest pusta</p>
  </div>

  <script>
    async function load() {
      const res = await fetch('/api/items');
      const items = await res.json();
      render(items);
    }

    function render(items) {
      const list = document.getElementById('list');
      const empty = document.getElementById('empty');
      const count = document.getElementById('count');

      const done = items.filter(i => i.done).length;
      count.textContent = `${done} / ${items.length} kupionych`;
      list.innerHTML = '';

      if (items.length === 0) { empty.style.display = 'block'; return; }
      empty.style.display = 'none';

      items.forEach(item => {
        const li = document.createElement('li');
        li.innerHTML = `
          <button class="check-btn ${item.done ? 'done' : ''}" onclick="toggle(${item.id})">
            ${item.done ? '✓' : ''}
          </button>
          <span class="item-name ${item.done ? 'done' : ''}">${item.name}</span>
          <button class="del-btn" onclick="remove(${item.id})">✕</button>
        `;
        list.appendChild(li);
      });
    }

    async function addItem() {
      const input = document.getElementById('newItem');
      const name = input.value.trim();
      if (!name) return;
      await fetch('/api/items', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name })
      });
      input.value = '';
      load();
    }

    async function toggle(id) {
      await fetch(`/api/items/${id}`, { method: 'PATCH' });
      load();
    }

    async function remove(id) {
      await fetch(`/api/items/${id}`, { method: 'DELETE' });
      load();
    }

    document.getElementById('newItem').addEventListener('keydown', e => {
      if (e.key === 'Enter') addItem();
    });

    load();
  </script>
</body>
</html>
